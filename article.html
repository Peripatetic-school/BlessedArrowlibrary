<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المقال — القِدحُ المُعَلَّى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand">
      <img src="logo.png" alt="شعار المكتبة" class="logo"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <svg class="logo" style="display:none;" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <circle cx="50" cy="50" r="46" stroke="currentColor" stroke-width="2.5"/>
        <path d="M50 24 L66 52 L57 52 L57 76 L43 76 L43 52 L34 52 Z" fill="currentColor"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">القِدحُ المُعَلَّى</span>
        <span class="brand-sub">مكتبة مستقلة</span>
      </div>
    </a>
    <button class="menu-toggle" aria-label="القائمة" onclick="document.getElementById('menuDropdown').classList.toggle('open')">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>
  <div class="menu-dropdown" id="menuDropdown">
    <a href="index.html">الرئيسية</a>
    <a href="books.html">الكتب</a>
    <a href="articles.html">المقالات</a>
    <a href="about.html">عن المكتبة</a>
  </div>
</header>

<main>
  <a href="articles.html" class="back-link" style="max-width:740px;margin:30px auto 0;display:block;padding:0 24px;">← العودة إلى المقالات</a>
  <div class="article-page" id="articlePage"></div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-text">
      <p>جميع هذه الأعمال والمواد نتاجٌ فرديٌ مستقلٌ محفوظ الحقوق 2027 ©، يُمنع نسخها أو إعادة توزيعها دون إذن كتابي مسبق.</p>
      <p>إن اقتناء الكتاب يمنحك حق القراءة شخصياً ولا يمنحك حق إعادة النشر.</p>
    </div>
  </div>
</footer>

<script src="data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const art = libraryData.articles[id];
  const container = document.getElementById('articlePage');

  if (!art) {
    container.innerHTML = '<div class="placeholder-note">لم يتم العثور على المقال المطلوب. <a href="articles.html">العودة إلى المقالات</a></div>';
  } else {
    document.title = art.title + ' — القِدحُ المُعَلَّى';
    const content = art.content
      ? `<div class="article-page-content">${art.content}</div>`
      : '<div class="placeholder-note">نص المقال قيد الإعداد وسيُنشر قريباً بإذن الله.</div>';

    container.innerHTML = `
      <div class="article-page-cat">${art.category}</div>
      <h1 class="article-page-title">${art.title}</h1>
      ${content}
    `;
  }
</script>
</body>
</html>
